<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>暗房 · 生成艺术工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23E8862E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="safelight-dot" aria-hidden="true"></span>
      <span class="brand-mark">暗房</span>
      <span class="brand-sub">DARKROOM</span>
    </div>

    <div class="now">
      <span class="now-name" id="nowName">流场粒子</span>
      <span class="now-hint" id="nowHint"></span>
    </div>

    <div class="top-actions">
      <label class="seed">
        <span class="seed-label">药方</span>
        <input id="seedInput" type="text" value="8421" spellcheck="false" autocomplete="off" aria-label="药方编号，改动后重新生成">
      </label>
      <button id="btnSeed" class="btn" type="button">换药方</button>
      <button id="btnSave" class="btn btn-accent" type="button">定影保存</button>
      <button id="btnFull" class="btn btn-icon" type="button" aria-label="全屏" title="全屏 (F)">⤢</button>
      <button id="btnHide" class="btn btn-icon" type="button" aria-label="隐藏界面" title="隐藏界面 (H)">▤</button>
    </div>
  </header>

  <aside class="panel" id="panel">
    <nav class="modes" id="modes" aria-label="算法"></nav>

    <section class="block">
      <h2 class="label">显影参数</h2>
      <div id="paramList" class="params"></div>
      <div class="param-actions">
        <button id="btnRandom" class="btn btn-ghost" type="button">随机参数</button>
        <button id="btnReset" class="btn btn-ghost" type="button">恢复默认</button>
      </div>
    </section>

    <section class="block">
      <h2 class="label">相纸</h2>
      <div id="paletteList" class="swatches" role="group" aria-label="配色"></div>
    </section>

    <section class="block block-quiet">
      <h2 class="label">快捷键</h2>
      <ul class="keys">
        <li><kbd>1</kbd>–<kbd>6</kbd><span>切换算法</span></li>
        <li><kbd>空格</kbd><span>暂停 / 继续</span></li>
        <li><kbd>R</kbd><span>换药方</span></li>
        <li><kbd>S</kbd><span>定影保存</span></li>
        <li><kbd>P</kbd><span>换相纸</span></li>
        <li><kbd>H</kbd><span>隐藏界面</span></li>
      </ul>
    </section>
  </aside>

  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="生成中的画面"></canvas>
    <div class="filmstrip" id="filmstrip" aria-live="polite" aria-label="已定影的画面"></div>
    <div class="stage-foot">
      <span class="fps" id="fps">—</span>
      <span class="foot-hint">在画面上移动或点击，每种算法的反应不同</span>
    </div>
  </main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/rng.js"></script>
<script src="js/sketch-flow.js"></script>
<script src="js/sketch-boids.js"></script>
<script src="js/sketch-packing.js"></script>
<script src="js/sketch-fractal.js"></script>
<script src="js/sketch-truchet.js"></script>
<script src="js/sketch-harmonic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
